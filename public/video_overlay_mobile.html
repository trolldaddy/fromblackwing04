<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>BOTC Overlay (Mobile)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="fflate.js"></script>
    <script src="compression.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 18px;
            color: #fff;
        }

        #leftPanel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px 18px 90px;
            background: rgba(0, 0, 0, 0.78);
            box-sizing: border-box;
            min-height: 100vh;
        }

        .mobile-info {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(24, 24, 24, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .mobile-info-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .mobile-info-body {
            font-size: 17px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .mobile-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.35);
        }

        .order-title,
        .category-title {
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 6px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .order-item:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .order-icon {
            width: 56px;
            height: 56px;
            flex: 0 0 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .order-icon-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 18px;
            font-weight: 600;
        }

        .order-name {
            flex: 1 1 auto;
            font-size: 18px;
            line-height: 1.3;
        }

        .category-title {
            margin-top: 4px;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
        }

        .role {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .role:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .role img {
            width: 96px;
            height: 96px;
            object-fit: contain;
        }

        .role-label {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body data-overlay-layout="mobile">
    <div id="leftPanel">
        <div id="mobileInfo" class="mobile-info">
            <div id="mobileInfoTitle" class="mobile-info-title">劇本資訊</div>
            <div id="mobileInfoBody" class="mobile-info-body">點擊角色以查看詳細能力與提醒。</div>
        </div>

        <section class="mobile-section">
            <div class="order-column">
                <div class="order-title">首夜行動</div>
                <div class="order-list" id="firstNightList"></div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="order-column">
                <div class="order-title">次夜行動</div>
                <div class="order-list" id="otherNightList"></div>
            </div>
        </section>

        <section class="mobile-section">
            <div class="category-title" id="townsfolkTitle">善良陣營：鎮民</div>
            <div class="role-grid" id="townsfolkGrid"></div>
        </section>

        <section class="mobile-section">
            <div class="category-title" id="outsiderTitle">善良陣營：外來者</div>
            <div class="role-grid" id="outsiderGrid"></div>
        </section>

        <section class="mobile-section">
            <div class="category-title" id="minionTitle">邪惡陣營：爪牙</div>
            <div class="role-grid" id="minionGrid"></div>
        </section>

        <section class="mobile-section">
            <div class="category-title" id="demonTitle">邪惡陣營：惡魔</div>
            <div class="role-grid" id="demonGrid"></div>
        </section>

        <section class="mobile-section">
            <div class="category-title" id="jinxTitle">相剋&特殊規則</div>
            <div class="role-grid" id="jinxGrid"></div>
        </section>
    </div>

    <script src="video_overlay.js"></script>
</body>
</html>
