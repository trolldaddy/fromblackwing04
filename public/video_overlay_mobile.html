<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>BOTC Overlay (Mobile)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="fflate.js"></script>
    <script src="compression.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 18px;
            color: #fff;
        }

        #leftPanel {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 18px 18px 90px;
            background: rgba(0, 0, 0, 0.78);
            box-sizing: border-box;
            min-height: 100vh;
        }

        .mobile-info {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(24, 24, 24, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .mobile-info-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .mobile-info-nav-button {
            border: none;
            background: none;
            color: #fff;
            font: inherit;
            padding: 4px 0;
            cursor: pointer;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .mobile-info-nav-button:focus {
            outline: 2px solid rgba(255, 255, 255, 0.6);
            outline-offset: 2px;
        }

        .mobile-info-nav-button[aria-disabled="true"] {
            opacity: 0.45;
            cursor: default;
        }

        .mobile-info-nav-button[aria-disabled="true"]:focus {
            outline: none;
        }

        .mobile-tabs {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mobile-tab-buttons {
            display: flex;
            gap: 8px;
            background: rgba(18, 18, 18, 0.9);
            padding: 6px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
        }

        .mobile-tab-button {
            flex: 1 1 0;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .mobile-tab-button:focus {
            outline: 2px solid rgba(255, 255, 255, 0.6);
            outline-offset: 2px;
        }

        .mobile-tab-button.active {
            background: rgba(255, 255, 255, 0.28);
            color: #fff;
        }

        .mobile-tab-panels {
            display: flex;
            flex-direction: column;
            gap: 18px;
            touch-action: pan-y;
        }

        .mobile-tab-panel {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .mobile-tab-panel.active {
            display: flex;
        }

        .mobile-info-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
        }

        .mobile-info-body {
            font-size: 17px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .mobile-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.35);
        }

        .order-title,
        .category-title {
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 6px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .order-item:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .order-icon {
            width: 56px;
            height: 56px;
            flex: 0 0 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .order-icon-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 18px;
            font-weight: 600;
        }

        .order-name {
            flex: 1 1 auto;
            font-size: 18px;
            line-height: 1.3;
        }

        .category-title {
            margin-top: 4px;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
        }

        .role {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .role:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .role img {
            width: 96px;
            height: 96px;
            object-fit: contain;
        }

        .role-label {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body data-overlay-layout="mobile">
    <div id="leftPanel">
        <div id="mobileInfo" class="mobile-info">
            <div class="mobile-info-nav" aria-label="快速切換分頁">
                <button
                    type="button"
                    class="mobile-info-nav-button"
                    data-mobile-nav-target="firstNight"
                    aria-controls="mobileTab-firstNight"
                    aria-disabled="false"
                >←首夜行動</button>
                <button
                    type="button"
                    class="mobile-info-nav-button"
                    data-mobile-nav-target="otherNight"
                    aria-controls="mobileTab-otherNight"
                    aria-disabled="false"
                >→次夜行動</button>
            </div>
            <div id="mobileInfoTitle" class="mobile-info-title">劇本資訊</div>
            <div id="mobileInfoBody" class="mobile-info-body">點擊角色以查看詳細能力與提醒。</div>
        </div>

        <div class="mobile-tabs">
            <div class="mobile-tab-buttons" role="tablist" aria-label="覆蓋層內容分頁">
                <button
                    type="button"
                    class="mobile-tab-button"
                    id="mobileTabButton-firstNight"
                    data-mobile-tab-button="firstNight"
                    role="tab"
                    aria-controls="mobileTab-firstNight"
                    aria-selected="false"
                    tabindex="-1"
                >首夜</button>
                <button
                    type="button"
                    class="mobile-tab-button active"
                    id="mobileTabButton-roles"
                    data-mobile-tab-button="roles"
                    role="tab"
                    aria-controls="mobileTab-roles"
                    aria-selected="true"
                    tabindex="0"
                >角色</button>
                <button
                    type="button"
                    class="mobile-tab-button"
                    id="mobileTabButton-otherNight"
                    data-mobile-tab-button="otherNight"
                    role="tab"
                    aria-controls="mobileTab-otherNight"
                    aria-selected="false"
                    tabindex="-1"
                >次夜</button>
            </div>

            <div class="mobile-tab-panels" id="mobileTabPanels">
                <div
                    class="mobile-tab-panel"
                    id="mobileTab-firstNight"
                    data-mobile-tab-panel="firstNight"
                    role="tabpanel"
                    aria-labelledby="mobileTabButton-firstNight"
                    aria-hidden="true"
                >
                    <section class="mobile-section">
                        <div class="order-column">
                            <div class="order-title">首夜行動</div>
                            <div class="order-list" id="firstNightList"></div>
                        </div>
                    </section>
                </div>

                <div
                    class="mobile-tab-panel active"
                    id="mobileTab-roles"
                    data-mobile-tab-panel="roles"
                    role="tabpanel"
                    aria-labelledby="mobileTabButton-roles"
                    aria-hidden="false"
                >
                    <section class="mobile-section">
                        <div class="category-title" id="townsfolkTitle">善良陣營：鎮民</div>
                        <div class="role-grid" id="townsfolkGrid"></div>
                    </section>

                    <section class="mobile-section">
                        <div class="category-title" id="outsiderTitle">善良陣營：外來者</div>
                        <div class="role-grid" id="outsiderGrid"></div>
                    </section>

                    <section class="mobile-section">
                        <div class="category-title" id="minionTitle">邪惡陣營：爪牙</div>
                        <div class="role-grid" id="minionGrid"></div>
                    </section>

                    <section class="mobile-section">
                        <div class="category-title" id="demonTitle">邪惡陣營：惡魔</div>
                        <div class="role-grid" id="demonGrid"></div>
                    </section>

                    <section class="mobile-section">
                        <div class="category-title" id="jinxTitle">相剋&特殊規則</div>
                        <div class="role-grid" id="jinxGrid"></div>
                    </section>
                </div>

                <div
                    class="mobile-tab-panel"
                    id="mobileTab-otherNight"
                    data-mobile-tab-panel="otherNight"
                    role="tabpanel"
                    aria-labelledby="mobileTabButton-otherNight"
                    aria-hidden="true"
                >
                    <section class="mobile-section">
                        <div class="order-column">
                            <div class="order-title">次夜行動</div>
                            <div class="order-list" id="otherNightList"></div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script src="video_overlay.js"></script>
</body>
</html>
